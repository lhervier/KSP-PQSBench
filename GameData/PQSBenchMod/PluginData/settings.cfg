// How much PQS Bench writes to KSP.log: Error, Warning, Info, Debug or Trace.
// The measurement itself always writes at Info, whatever this says.
// Read once when KSP starts: quit KSP, edit this file, start KSP again.
logLevel = Info

// What to measure. Results are kept in memory and written only when asked for: Alt+F8 dumps them to
// KSP.log, Alt+F7 throws them away and starts again.
//   off       - nothing at all. No patch is installed: the mod costs exactly nothing.
//   counters  - what the terrain costs in flight, one line per second of game time.
//   calibrate - what one terrain vertex costs: on one quad in thirty-two, and in the frame that built
//               it, the vertex placement KSP actually runs, whichever mod is patching it or stock when
//               none is, timed against the stock one on the same data.
// The two are exclusive, and one run measures one of them: calibrate does real work inside the very
// frames counters times, so a run cannot honestly report both.
benchMode = off
